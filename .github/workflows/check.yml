name: 功能检查
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest tests/test_reprokit.py tests/test_api.py -k "not parallel" -q
      - run: python -m pandao_repro demo --out demo-output
